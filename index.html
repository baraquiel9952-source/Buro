<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Reporte Buró - Sintético</title>
    <style>
        :root {
            --primary: #1a237e; --primary-light: #534bae; --accent: #ff6f00;
            --success: #2e7d32; --error: #c62828;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #e8eaf6, #f5f5f5);
            min-height: 100vh; padding: 20px;
        }
        .container {
            background: white; border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            padding: 30px; max-width: 650px; margin: 0 auto;
        }
        h1 { text-align: center; color: var(--primary); font-size: 22px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 12px; margin-bottom: 20px; }
        
        .section {
            border: 2px solid #e8eaf6; border-radius: 10px;
            padding: 15px; margin: 15px 0;
        }
        .section-title {
            font-weight: 700; color: var(--primary); font-size: 13px;
            margin-bottom: 12px; text-transform: uppercase;
        }
        
        label { display: block; font-weight: 600; font-size: 11px; margin: 10px 0 4px; }
        input, select {
            width: 100%; padding: 10px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 14px;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary-light); }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .btn {
            width: 100%; padding: 13px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            margin-top: 12px; transition: all 0.3s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-light); }
        .btn-pdf { background: var(--accent); color: white; }
        .btn-json { background: #455a64; color: white; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .btn .spinner {
            display: none; width: 18px; height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .btn.loading .spinner { display: inline-block; }
        .btn.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .alert {
            padding: 12px; border-radius: 8px; margin-top: 12px;
            display: none; font-size: 13px;
        }
        .alert-success { background: #e8f5e9; color: var(--success); display: block; }
        .alert-error { background: #ffebee; color: var(--error); display: block; }
        
        .result-card {
            display: none; background: #fafafa; border-radius: 10px;
            padding: 15px; margin-top: 15px;
        }
        .result-card.show { display: block; }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; }
        .result-item { padding: 8px; background: white; border-radius: 6px; }
        .result-item .label { font-size: 9px; text-transform: uppercase; color: #888; }
        .result-item .value { font-weight: 600; }
        
        .disclaimer {
            margin-top: 15px; padding: 10px; background: #fff3e0;
            border-radius: 8px; font-size: 10px; color: #e65100; text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Reporte Buró Sintético</h1>
        <p class="subtitle">Generador profesional de reportes de crédito para testing</p>
        
        <!-- SECCIÓN: DATOS PERSONALES -->
        <div class="section">
            <div class="section-title">👤 Datos Personales</div>
            <label>Nombre completo: *</label>
            <input type="text" id="nombre" placeholder="Apellido1 Apellido2 Nombre">
            
            <div class="row">
                <div>
                    <label>Fecha de nacimiento:</label>
                    <input type="text" id="fechaNac" placeholder="DD/MM/AAAA">
                </div>
                <div>
                    <label>RFC:</label>
                    <input type="text" id="rfc" maxlength="13" placeholder="XXXX000000XXX">
                </div>
            </div>
            
            <div class="row">
                <div>
                    <label>CURP:</label>
                    <input type="text" id="curp" maxlength="18" placeholder="XXXX000000XXXXXXXX">
                </div>
                <div>
                    <label>Empleo:</label>
                    <select id="empleo">
                        <option value="">Aleatorio</option>
                        <option>Empleado</option>
                        <option>Independiente</option>
                        <option>Empresario</option>
                        <option>Profesionista</option>
                        <option>Comerciante</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- SECCIÓN: PERSONALIZACIÓN -->
        <div class="section">
            <div class="section-title">⚙️ Personalización (Opcional)</div>
            <div class="row">
                <div>
                    <label>Número de créditos:</label>
                    <input type="number" id="numCreditos" min="1" max="15" placeholder="Aleatorio (2-8)">
                </div>
                <div>
                    <label>Rango de score:</label>
                    <select id="rangoScore">
                        <option value="">Aleatorio (400-850)</option>
                        <option value="750-850">Excelente (750-850)</option>
                        <option value="680-749">Bueno (680-749)</option>
                        <option value="600-679">Regular (600-679)</option>
                        <option value="400-599">Malo (400-599)</option>
                    </select>
                </div>
            </div>
            
            <div class="row">
                <div>
                    <label>Institución específica:</label>
                    <select id="institucion">
                        <option value="">Aleatoria</option>
                        <option>BBVA México</option>
                        <option>Banorte</option>
                        <option>Santander</option>
                        <option>HSBC</option>
                        <option>Nu México</option>
                        <option>Stori</option>
                    </select>
                </div>
                <div>
                    <label>Tipo de crédito:</label>
                    <select id="tipoCredito">
                        <option value="">Aleatorio</option>
                        <option>Tarjeta de Crédito</option>
                        <option>Préstamo Personal</option>
                        <option>Crédito Hipotecario</option>
                        <option>Crédito Automotriz</option>
                    </select>
                </div>
            </div>
        </div>
        
        <button class="btn btn-primary" id="btnGenerar" onclick="generarDatos()">
            <span class="btn-text">⚡ Generar Reporte</span>
            <span class="spinner"></span>
        </button>
        
        <div class="alert" id="alert"></div>
        
        <div class="result-card" id="resultCard">
            <div class="result-grid" id="resultGrid"></div>
            <button class="btn btn-pdf" id="btnPDF" onclick="generarPDF()">
                <span class="btn-text">📥 Descargar PDF</span>
                <span class="spinner"></span>
            </button>
            <button class="btn btn-json" id="btnJSON" onclick="descargarJSON()">
                <span class="btn-text">📄 Descargar JSON Completo</span>
            </button>
        </div>
        
        <p class="disclaimer">⚠️ Documento sintético sin validez oficial. Solo para testing y desarrollo.</p>
    </div>

    <script>
        let reporteCompleto = null;

        function obtenerDatosFormulario() {
            const rango = document.getElementById('rangoScore').value;
            let rangoScore = null;
            if (rango) {
                const [min, max] = rango.split('-').map(Number);
                rangoScore = [min, max];
            }
            
            return {
                nombre: document.getElementById('nombre').value.trim(),
                fecha_nacimiento: document.getElementById('fechaNac').value.trim(),
                rfc: document.getElementById('rfc').value.trim(),
                curp: document.getElementById('curp').value.trim(),
                empleo: document.getElementById('empleo').value || undefined,
                num_creditos: parseInt(document.getElementById('numCreditos').value) || undefined,
                rango_score: rangoScore,
                institucion: document.getElementById('institucion').value || undefined,
                tipo_credito: document.getElementById('tipoCredito').value || undefined,
                domicilio: {},
            };
        }

        async function generarDatos() {
            const datos = obtenerDatosFormulario();
            const alertEl = document.getElementById('alert');
            const btnGenerar = document.getElementById('btnGenerar');
            const resultCard = document.getElementById('resultCard');
            const resultGrid = document.getElementById('resultGrid');
            
            if (!datos.nombre) {
                alertEl.className = 'alert alert-error';
                alertEl.textContent = 'Ingresa el nombre completo';
                return;
            }
            
            btnGenerar.classList.add('loading');
            btnGenerar.disabled = true;
            alertEl.className = 'alert';
            resultCard.classList.remove('show');
            
            try {
                const resp = await fetch('/api/reporte', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(datos)
                });
                const data = await resp.json();
                
                if (data.exito) {
                    reporteCompleto = data.reporte;
                    const score = data.reporte.score;
                    const resumen = data.reporte.resumen;
                    const consumidor = data.reporte.consumidor;
                    
                    resultGrid.innerHTML = `
                        <div class="result-item"><div class="label">Score</div><div class="value">${score.puntaje} (${score.interpretacion})</div></div>
                        <div class="result-item"><div class="label">Créditos</div><div class="value">${resumen.total_creditos}</div></div>
                        <div class="result-item"><div class="label">Saldo Total</div><div class="value">$${resumen.total_saldo.toLocaleString()}</div></div>
                        <div class="result-item"><div class="label">Al Corriente</div><div class="value">${resumen.al_corriente}</div></div>
                        <div class="result-item"><div class="label">Domicilios</div><div class="value">${consumidor.domicilios.length}</div></div>
                        <div class="result-item"><div class="label">Folio</div><div class="value">${data.reporte.encabezado.folio_formateado}</div></div>
                    `;
                    resultCard.classList.add('show');
                    alertEl.className = 'alert alert-success';
                    alertEl.textContent = '✅ Reporte generado correctamente';
                } else {
                    alertEl.className = 'alert alert-error';
                    alertEl.textContent = '❌ ' + data.error;
                }
            } catch(e) {
                alertEl.className = 'alert alert-error';
                alertEl.textContent = '❌ Error: ' + e.message;
            } finally {
                btnGenerar.classList.remove('loading');
                btnGenerar.disabled = false;
            }
        }

        async function generarPDF() {
            if (!reporteCompleto) {
                alertEl.className = 'alert alert-error';
                alertEl.textContent = 'Primero genera el reporte';
                return;
            }
            
            const btnPDF = document.getElementById('btnPDF');
            const alertEl = document.getElementById('alert');
            btnPDF.classList.add('loading');
            btnPDF.disabled = true;
            
            try {
                const resp = await fetch('/api/reporte/pdf', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({reporte: reporteCompleto})
                });
                
                if (!resp.ok) throw new Error('Error al generar PDF');
                
                const blob = await resp.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `reporte_buro_${Date.now()}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                alertEl.className = 'alert alert-success';
                alertEl.textContent = '✅ PDF descargado';
            } catch(e) {
                alertEl.className = 'alert alert-error';
                alertEl.textContent = '❌ Error: ' + e.message;
            } finally {
                btnPDF.classList.remove('loading');
                btnPDF.disabled = false;
            }
        }

        function descargarJSON() {
            if (!reporteCompleto) return;
            const blob = new Blob([JSON.stringify(reporteCompleto, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `reporte_buro_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
            </html>
